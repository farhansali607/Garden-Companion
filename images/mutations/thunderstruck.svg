<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <defs>
    <linearGradient id="boltGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF27A"/>
      <stop offset="55%" stop-color="#F5C52A"/>
      <stop offset="100%" stop-color="#E59A13"/>
    </linearGradient>
  </defs>

  <!-- Lightning bolt -->
  <path
    d="M36 5
       L18 33
       H30
       L25 59
       L48 27
       H35
       Z"
    fill="url(#boltGradient)"
  />

  <!-- Small blue electric spark -->
  <path
    d="M49 10
       C50 14 53 17 57 18
       C53 19 50 22 49 26
       C48 22 45 19 41 18
       C45 17 48 14 49 10Z"
    fill="#55D9FF"
  />

  <!-- Tiny highlight -->
  <path
    d="M32 13 L25 26"
    stroke="#FFF9C7"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.8"
  />

</svg>