<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <defs>
    <linearGradient id="dawnboundOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9fd2"/>
      <stop offset="55%" stop-color="#d86fd3"/>
      <stop offset="100%" stop-color="#8f58d8"/>
