<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <defs>
    <linearGradient id="rulerGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd86a"/>
      <stop offset="55%" stop-color="#f0b83d"/>
      <stop offset="100%" stop-color="#cf8420"/>
    </linearGradient>
  </defs>

  <!-- Ruler body -->
  <g transform="rotate(-28 32 32)">
    <rect
      x="12"
      y="24"
      width="40"
      height="16"
      rx="4"
      fill="url(#rulerGradient)"
    />

    <!-- Ruler edge highlight -->
    <rect
      x="14"
      y="26"
      width="36"
      height="3"
      rx="1.5"
      fill="#fff0ad"
      opacity="0.7"
    />

    <!-- Measurement marks -->
    <path
      d="
        M19 24 V31
        M25 24 V28
        M31 24 V31
        M37 24 V28
        M43 24 V31
      "
      stroke="#8f5b18"
      stroke-width="2"
      stroke-linecap="round"
    />

    <!-- Small end detail -->
    <circle
      cx="47"
      cy="35"
      r="2"
      fill="#a86d1f"
      opacity="0.7"
    />
  </g>

</svg>