<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
>

    <defs>
        <linearGradient
            id="normalLeafGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#66D66A"
            />

            <stop
                offset="100%"
                stop-color="#2D9B4B"
            />
        </linearGradient>
    </defs>


    <!-- LEFT LEAF -->

    <path
        d="
            M31 35
            C20 34 13 27 12 16
            C22 16 30 22 32 31
            C32 33 32 34 31 35
        "
        fill="url(#normalLeafGradient)"
    />


    <!-- RIGHT LEAF -->

    <path
        d="
            M33 31
            C35 20 43 14 54 14
            C53 26 46 34 33 36
            C32 34 32 33 33 31
        "
        fill="url(#normalLeafGradient)"
    />


    <!-- STEM -->

    <path
        d="
            M32 31
            C32 39 31 45 31 53
        "
        fill="none"
        stroke="#258441"
        stroke-width="4"
        stroke-linecap="round"
    />


    <!-- LEAF DETAILS -->

    <path
        d="
            M30 32
            C25 27 21 24 17 21
        "
        fill="none"
        stroke="#B9F3B7"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.8"
    />

    <path
        d="
            M34 32
            C39 27 44 23 49 19
        "
        fill="none"
        stroke="#B9F3B7"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.8"
    />


    <!-- SMALL SPARKLES -->

    <circle
        cx="15"
        cy="40"
        r="2"
        fill="#7DE27D"
        opacity="0.85"
    />

    <circle
        cx="49"
        cy="43"
        r="2"
        fill="#7DE27D"
        opacity="0.75"
    />

    <circle
        cx="43"
        cy="8"
        r="1.5"
        fill="#A6EFA3"
        opacity="0.8"
    />

</svg>