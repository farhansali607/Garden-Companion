<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <defs>
    <linearGradient id="dawnlitGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff79bd"/>
      <stop offset="55%" stop-color="#d83b8c"/>
      <stop offset="100%" stop-color="#9d3cc6"/>
    </linearGradient>

    <radialGradient id="dawnGlow">
      <stop offset="0%" stop-color="#fff4a8"/>
      <stop offset="100%" stop-color="#ffc94d"/>
