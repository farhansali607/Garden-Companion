<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <defs>
    <linearGradient id="amberlitGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe38a"/>
      <stop offset="55%" stop-color="#f0a33a"/>
      <stop offset="100%" stop-color="#c96a1f"/>
    </linearGradient>

    <radialGradient id="amberGlow">
      <stop offset="0%" stop-color="#fff7be"/>
      <stop offset="100%" stop-color="#ffd36a"/>
    </radialGradient>
  </defs>

  <!-- Main star shape -->
  <path
    d="
      M32 7
      C35 22 42 29 57 32
      C42 35 35 42 32 57
      C29 42 22 35 7 32
      C22 29 29 22 32 7Z
    "
    fill="url(#amberlitGradient)"
  />

  <!-- Warm glowing center -->
  <circle
    cx="32"
    cy="32"
    r="7"
    fill="url(#amberGlow)"
  />

  <!-- Small sparkle -->
  <path
    d="
      M48 8
      C49 13 52 16 57 17
      C52 18 49 21 48 26
      C47 21 44 18 39 17
      C44 16 47 13 48 8Z
    "
    fill="#fff8ef"
  />

</svg>