<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Garden Companion</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main class="app">


        <!-- =========================================
             HEADER
             ========================================= -->

        <header class="top-header">


            <!-- TITLE -->

            <div class="title-area">

                <h1 class="site-title">

                    <span class="title-leaf left-leaf">
                        🌿
                    </span>

                    <span>
                        Garden Companion
                    </span>

                    <span class="title-leaf right-leaf">
                        🌿
                    </span>

                </h1>


                <p class="site-subtitle">
                    Track Every Mutation. Complete Your Collection.
                </p>

            </div>



            <!-- =========================================
                 OVERALL COLLECTION PROGRESS
                 ========================================= -->

            <div class="overall-progress">


               <div
    class="overall-icon"
    id="overall-icon"
>
    🍃
</div>


                <div class="overall-progress-info">

                    <div
                        class="progress-number"
                        id="overall-count"
                    >
                        0 / 832
                    </div>


                    <div
                        class="progress-label"
                        id="overall-label"
                    >
                        Plants Collected
                    </div>


                    <div class="overall-progress-bar">

                        <div
                            class="overall-progress-fill"
                            id="overall-progress-fill"
                        ></div>

                    </div>


                    <div
                        class="progress-percent"
                        id="overall-percent"
                    >
                        0% Complete
                    </div>

                </div>

            </div>

        </header>



        <!-- =========================================
             PLANTS / PETS TABS
             ========================================= -->

        <nav class="tabs">


            <button
                class="tab active"
                id="plants-tab"
                type="button"
            >

                <span class="tab-icon">
                    🌱
                </span>

                <span>
                    Plants
                </span>

            </button>


            <button
                class="tab"
                id="pets-tab"
                type="button"
            >

                <span class="tab-icon">
                    🐾
                </span>

                <span>
                    Pets
                </span>

            </button>


        </nav>



        <!-- =========================================
             PLANTS PAGE
             ========================================= -->

        <section
            class="page-view"
            id="plants-view"
        >


            <!-- =========================================
                 SEARCH + BUTTONS
                 ========================================= -->

            <div class="controls">


                <!-- SEARCH -->

                <div class="search-box">

                    <span class="search-icon">
                        ⌕
                    </span>

                    <input
                        type="text"
                        id="plant-search"
                        placeholder="Search plants..."
                        autocomplete="off"
                    >

                </div>



                <!-- HIDE COMPLETED -->

                <button
                    class="control-button"
                    id="completed-toggle"
                    type="button"
                >
                    👁 Hide Completed
                </button>



                <!-- COLLAPSE ALL -->

                <button
                    class="control-button"
                    id="collapse-all"
                    type="button"
                >
                    ▼ Collapse All
                </button>



                <!-- CLEAR ALL -->

                <button
                    class="control-button danger-button"
                    id="clear-all"
                    type="button"
                >
                    ✕ Clear All
                </button>


            </div>



            <!-- =========================================
                 MUTATION SECTIONS

                 JavaScript automatically adds
                 all 13 mutation sections here.
                 ========================================= -->

            <section
                class="mutation-list"
                id="mutation-list"
            ></section>


        </section>



        <!-- =========================================
             PETS PAGE
             ========================================= -->

      <section
    class="page-view hidden"
    id="pets-view"
>

    <!-- PET SEARCH + BUTTONS -->

    <div class="controls">

        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>

            <input
                type="text"
                id="pet-search"
                placeholder="Search pets..."
                autocomplete="off"
            >

        </div>


        <button
            class="control-button"
            id="pet-completed-toggle"
            type="button"
        >
            👁 Hide Completed
        </button>


        <button
            class="control-button"
            id="pet-collapse-all"
            type="button"
        >
            ▼ Collapse All
        </button>


        <button
            class="control-button danger-button"
            id="pet-clear-all"
            type="button"
        >
            ✕ Clear All
        </button>

    </div>


    <!--
        JavaScript will automatically put
        the 4 pet mutation sections here.
    -->

    <section
        class="mutation-list"
        id="pet-mutation-list"
    ></section>

</section>

</section>



        <!-- =========================================
             FOOTER
             ========================================= -->

        <footer class="site-footer">

            <div class="footer-message">

                <span class="footer-leaf">
                    🌱
                </span>

                <span>
                    Grow together. Discover everything.
                </span>

                <span class="footer-leaf footer-leaf-right">
                    🌿
                </span>

            </div>

        </footer>


    </main>



    <!-- =========================================
         JAVASCRIPT

         JavaScript stays at the bottom so the HTML
         exists before JavaScript tries to use it.
         ========================================= -->

    <script src="js/app.js"></script>


</body>

</html>
